name: Build native desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder
        run: python -m pip install --upgrade pillow pyinstaller
      - name: Build app bundle
        working-directory: desktop
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name SixFinancialRank
          --add-data "../project-assets:project-assets"
          --add-data "config:config"
          desktop_app.py
      - name: Apply ad-hoc signature and verify app
        run: |
          codesign --force --deep --sign - desktop/dist/SixFinancialRank.app
          codesign --verify --deep --strict desktop/dist/SixFinancialRank.app
          desktop/dist/SixFinancialRank.app/Contents/MacOS/SixFinancialRank --self-test
          file desktop/dist/SixFinancialRank.app/Contents/MacOS/SixFinancialRank | grep -q arm64
      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R desktop/dist/SixFinancialRank.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Six Financial Rank" -srcfolder dmg-root -ov -format UDZO SixFinancialRank-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SixFinancialRank-macOS-AppleSilicon
          path: SixFinancialRank-macOS-AppleSilicon.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows 64-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install builder
        run: python -m pip install --upgrade pillow pyinstaller
      - name: Build single executable
        working-directory: desktop
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SixFinancialRank
          --add-data "../project-assets;project-assets"
          --add-data "config;config"
          desktop_app.py
      - name: Verify executable
        shell: pwsh
        run: |
          desktop/dist/SixFinancialRank.exe --self-test
          if (-not [System.Environment]::Is64BitProcess) { throw "Builder is not 64-bit" }
      - name: Package download
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/SixFinancialRank.exe,desktop/README.md -DestinationPath SixFinancialRank-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SixFinancialRank-Windows-x64
          path: SixFinancialRank-Windows-x64.zip
          if-no-files-found: error
