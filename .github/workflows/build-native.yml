name: Build native desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder
        run: python -m pip install --upgrade pillow pyinstaller
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64" || { echo "Missing Apple signing certificate secret"; exit 1; }
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > developer-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import developer-id.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$SIGNING_IDENTITY" || { echo "Developer ID Application identity not found"; exit 1; }
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Build app bundle
        working-directory: desktop
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name SixFinancialRank
          --add-data "../project-assets:project-assets"
          --add-data "config:config"
          desktop_app.py
      - name: Sign and verify app
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" desktop/dist/SixFinancialRank.app
          codesign --verify --deep --strict desktop/dist/SixFinancialRank.app
          codesign -dv --verbose=4 desktop/dist/SixFinancialRank.app
          desktop/dist/SixFinancialRank.app/Contents/MacOS/SixFinancialRank --self-test
          file desktop/dist/SixFinancialRank.app/Contents/MacOS/SixFinancialRank | grep -q arm64
      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R desktop/dist/SixFinancialRank.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Six Financial Rank" -srcfolder dmg-root -ov -format UDZO SixFinancialRank-macOS-AppleSilicon.dmg
      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit SixFinancialRank-macOS-AppleSilicon.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple SixFinancialRank-macOS-AppleSilicon.dmg
          xcrun stapler validate SixFinancialRank-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SixFinancialRank-macOS-AppleSilicon
          path: SixFinancialRank-macOS-AppleSilicon.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows 64-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install builder
        run: python -m pip install --upgrade pillow pyinstaller
      - name: Build single executable
        working-directory: desktop
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SixFinancialRank
          --add-data "../project-assets;project-assets"
          --add-data "config;config"
          desktop_app.py
      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { throw "Missing Windows signing certificate secret" }
          [IO.File]::WriteAllBytes("windows-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe not found" }
          & $signTool.FullName sign /f windows-signing.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 desktop/dist/SixFinancialRank.exe
          & $signTool.FullName verify /pa /v desktop/dist/SixFinancialRank.exe
      - name: Verify executable
        shell: pwsh
        run: |
          desktop/dist/SixFinancialRank.exe --self-test
          if (-not [System.Environment]::Is64BitProcess) { throw "Builder is not 64-bit" }
      - name: Package download
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/SixFinancialRank.exe,desktop/README.md -DestinationPath SixFinancialRank-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SixFinancialRank-Windows-x64
          path: SixFinancialRank-Windows-x64.zip
          if-no-files-found: error
