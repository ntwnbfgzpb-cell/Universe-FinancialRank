name: Build modern desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-next/**"
      - "desktop/**"
      - ".github/workflows/build-modern-desktop.yml"

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: desktop-next/package-lock.json,
          }
      - run: pip install pyinstaller
      - name: Build local data engine
        run: |
          pyinstaller --noconfirm --clean --onefile --name rank-local-api --add-data "desktop/config:config" desktop/local_api.py
          dist/rank-local-api --db "$RUNNER_TEMP/rank-smoke.db" --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/backend.log" 2>&1 &
          API_PID=$!
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8765/api/v1/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8765/api/v1/openapi.json | grep -q '3.0.3'
          kill $API_PID
          mkdir -p desktop-next/backend
          cp dist/rank-local-api desktop-next/backend/
      - run: npm ci
        working-directory: desktop-next
      - name: Create approved macOS icon
        run: |
          mkdir -p desktop-next/build/icon.iconset
          sips -z 16 16 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_16x16.png
          sips -z 32 32 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_32x32.png
          sips -z 64 64 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_128x128.png
          sips -z 256 256 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_256x256.png
          sips -z 512 512 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 desktop-next/build/icon.png --out desktop-next/build/icon.iconset/icon_512x512.png
          cp desktop-next/build/icon.png desktop-next/build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns desktop-next/build/icon.iconset -o desktop-next/build/icon.icns
      - run: npm run dist:mac
        working-directory: desktop-next
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Verify macOS package
        run: |
          DMG=$(find desktop-next/release -name '*.dmg' -print -quit)
          test -n "$DMG"
          test $(stat -f%z "$DMG") -gt 50000000
          hdiutil verify "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: Universe-FinancialRank-macOS-AppleSilicon-unsigned
          path: desktop-next/release/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: desktop-next/package-lock.json,
          }
      - run: pip install pyinstaller
      - name: Build local data engine
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name rank-local-api --add-data "desktop/config;config" desktop/local_api.py
          $process = Start-Process -FilePath dist/rank-local-api.exe -ArgumentList "--db", "$env:RUNNER_TEMP\rank-smoke.db", "--host", "127.0.0.1", "--port", "8765" -PassThru -WindowStyle Hidden
          $healthy = $false
          for ($i=0; $i -lt 30; $i++) { try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health; if ($health.status -eq "ok") { $healthy=$true; break } } catch {}; Start-Sleep -Seconds 1 }
          if (-not $healthy) { Stop-Process -Id $process.Id -Force; throw "Packaged local API failed health check" }
          $openapi = Invoke-RestMethod http://127.0.0.1:8765/api/v1/openapi.json
          if ($openapi.openapi -ne "3.0.3") { throw "OpenAPI smoke check failed" }
          Stop-Process -Id $process.Id -Force
          New-Item -ItemType Directory -Force desktop-next/backend
          Copy-Item dist/rank-local-api.exe desktop-next/backend/
      - run: npm ci
        working-directory: desktop-next
      - run: npm run dist:win
        working-directory: desktop-next
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Verify Windows package
        shell: pwsh
        run: |
          $artifact = Get-ChildItem desktop-next/release/*.exe | Select-Object -First 1
          if (-not $artifact -or $artifact.Length -lt 50000000) { throw "Portable EXE missing or unexpectedly small" }
      - uses: actions/upload-artifact@v4
        with:
          name: Universe-FinancialRank-Windows-x64-unsigned
          path: desktop-next/release/*.exe
          if-no-files-found: error
          retention-days: 14
